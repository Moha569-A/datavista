name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API — tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
        working-directory: apps/api
      # The API's analytics-dependent assertions need the Python service.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r services/analytics/requirements.txt
      - run: uvicorn app.main:app --host 127.0.0.1 --port 8788 &
        working-directory: services/analytics
      - run: npx wait-on http://127.0.0.1:8788/health --timeout 60000
      - run: npm test
        working-directory: apps/api

  analytics:
    name: Analytics — pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r services/analytics/requirements.txt
      - run: python -m pytest
        working-directory: services/analytics

  web:
    name: Web — build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npx vitest run
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [api, analytics, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.api .
      - run: docker build -f Dockerfile.analytics .
      - run: docker build -f Dockerfile.web .
